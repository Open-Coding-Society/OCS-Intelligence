services:
  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-client
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "-c", "netbird service run"]
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./netbird_data:/etc/netbird

# docker exec -it netbird-client bash