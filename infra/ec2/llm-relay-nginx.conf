server {
    if ($host = ai.opencodingsociety.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ai.opencodingsociety.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.opencodingsociety.com;

    location /v1/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 2m;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9100/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://100.75.123.203:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/ai.opencodingsociety.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.opencodingsociety.com/privkey.pem; # managed by Certbot
}
