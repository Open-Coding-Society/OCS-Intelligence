- name: /opt/ocs belongs to ocs
  ansible.builtin.file: {path: "{{ ocs_root }}", state: directory, owner: ocs, group: ocs, mode: "0755"}

- name: Copy the locked requirements
  ansible.builtin.copy:
    src: cluster-requirements.txt
    dest: "{{ ocs_root }}/cluster-requirements.txt"
    owner: ocs
    group: ocs
    mode: "0644"

- name: Is the download cache on silver answering, with a complete wheelhouse for our lock?
  ansible.builtin.uri:
    url: "http://{{ ocs_cache_host }}:{{ ocs_cache_http_port }}/wheels/READY"
    timeout: 3
    return_content: true
  register: ocs_cache_ready
  failed_when: false

- name: Our lock's fingerprint (sha256 of the copied file, as the cache computes it)
  ansible.builtin.stat:
    path: "{{ ocs_root }}/cluster-requirements.txt"
    checksum_algorithm: sha256
  register: ocs_lock

- name: Use the cache only if its wheelhouse was built from this exact lock
  ansible.builtin.set_fact:
    ocs_cache_ok: "{{ ocs_cache_ready.status | default(0) == 200 and (ocs_cache_ready.content | default('') | trim) == ocs_lock.stat.checksum }}"

- name: Installed uv version
  ansible.builtin.command: /usr/local/bin/uv --version
  register: uv_have
  failed_when: false
  changed_when: false

- name: uv from the cache
  when:
    - ocs_uv_version not in (uv_have.stdout | default(''))
    - ocs_cache_ok | bool
  ansible.builtin.get_url:
    url: "http://{{ ocs_cache_host }}:{{ ocs_cache_http_port }}/uv/uv"
    dest: /usr/local/bin/uv
    mode: "0755"
    force: true

- name: Installed uv version, again
  ansible.builtin.command: /usr/local/bin/uv --version
  register: uv_have
  failed_when: false
  changed_when: false

- name: Otherwise uv from Astral's installer (pinned version, into /usr/local/bin)
  when: ocs_uv_version not in (uv_have.stdout | default(''))
  block:
    - name: Download the installer
      ansible.builtin.get_url:
        url: "https://astral.sh/uv/{{ ocs_uv_version }}/install.sh"
        dest: /tmp/uv-install.sh
        mode: "0755"
        force: true
    - name: Run it
      ansible.builtin.command: sh /tmp/uv-install.sh
      environment: {UV_INSTALL_DIR: /usr/local/bin, UV_NO_MODIFY_PATH: "1"}
      changed_when: true

- name: Shell environment for uv, Python and Ray
  ansible.builtin.copy:
    dest: /etc/profile.d/ocs.sh
    content: |
      # Managed by Ansible. The cluster's Python and Ray live in {{ ocs_venv }}.
      export UV_PYTHON_INSTALL_DIR={{ ocs_root }}/python
      export RAY_USAGE_STATS_ENABLED=0
      case ":$PATH:" in *:{{ ocs_venv }}/bin:*) ;; *) export PATH="$PATH:{{ ocs_venv }}/bin" ;; esac
    mode: "0644"

- name: Python {{ ocs_python_version }} managed by uv
  ansible.builtin.command: /usr/local/bin/uv python install {{ ocs_python_version }}
  become_user: ocs
  environment: {UV_PYTHON_INSTALL_DIR: "{{ ocs_root }}/python"}
  register: uv_py
  changed_when: "'Installed' in uv_py.stderr"

- name: The cluster venv
  ansible.builtin.command: >-
    /usr/local/bin/uv venv {{ ocs_venv }} --python {{ ocs_python_version }} --python-preference only-managed
  args: {creates: "{{ ocs_venv }}/bin/python"}
  become_user: ocs
  environment: {UV_PYTHON_INSTALL_DIR: "{{ ocs_root }}/python"}

- name: Install exactly the locked packages (uv pip sync)
  ansible.builtin.command: >-
    /usr/local/bin/uv pip sync {{ ocs_root }}/cluster-requirements.txt --python {{ ocs_venv }}/bin/python
    {{ ('--no-index --find-links http://' ~ ocs_cache_host ~ ':' ~ ocs_cache_http_port ~ '/wheels/')
       if ocs_cache_ok | bool else '' }}
  become_user: ocs
  register: uv_sync
  changed_when: "'Installed' in uv_sync.stderr or 'Uninstalled' in uv_sync.stderr"
