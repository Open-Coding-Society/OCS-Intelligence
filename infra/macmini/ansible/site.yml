# Set up every Mac mini the same way ("silver" = the first one, the reference).
#   cd infra/macmini/ansible
#   uv run --group ansible ansible-playbook site.yml                 # all Mac minis
#   uv run --group ansible ansible-playbook site.yml --limit silver  # one
#   ... --tags ray_check                                             # just the Ray smoke test
# Guide: docs/operations/set-up-mac-minis.md
- name: Mac mini baseline
  hosts: macminis
  become: true
  tasks:
    - name: Secrets are present
      ansible.builtin.assert:
        that: ansible_become_password | length > 0
        fail_msg: "MACMINI_SUDO_PASSWORD is missing from {{ ocs_env_file }}"
      tags: always
    - ansible.builtin.import_tasks: tasks/base.yml
      tags: base
    - ansible.builtin.import_tasks: tasks/hostname.yml
      tags: hostname
    - ansible.builtin.import_tasks: tasks/network.yml
      tags: network
    - ansible.builtin.import_tasks: tasks/python.yml
      tags: python
    - ansible.builtin.import_tasks: tasks/netbird.yml
      tags: netbird
    - ansible.builtin.import_tasks: tasks/ray_check.yml
      tags: ray_check
  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
    - name: Restart zramswap
      ansible.builtin.systemd_service: {name: zramswap, state: restarted}
    - name: Restart mbpfan
      ansible.builtin.systemd_service: {name: mbpfan, state: restarted}
