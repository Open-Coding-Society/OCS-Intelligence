[defaults]
# inventory.py finds the Mac minis on the LAN each run, so no IPs are written down.
inventory = inventory.py
remote_user = ocs
interpreter_python = /usr/bin/python3
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
# Host key checking: group_vars/macminis.yml (by machine name, file kept by inventory.py).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
