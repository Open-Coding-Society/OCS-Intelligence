[defaults]
# inventory.py finds the Mac minis on the LAN each run, so no IPs are written down.
inventory = inventory.py
remote_user = ocs
interpreter_python = /usr/bin/python3
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
