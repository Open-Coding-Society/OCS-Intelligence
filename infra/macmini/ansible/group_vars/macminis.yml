# Settings for every Mac mini. Secrets are read from the repo-root .env (gitignored),
# never written here.
ocs_env_file: "{{ playbook_dir }}/../../../.env"
# Host keys checked by machine name, not IP (addresses move). inventory.py keeps the file.
ansible_ssh_common_args: >-
  -o HostKeyAlias={{ inventory_hostname }}
  -o UserKnownHostsFile=~/.ssh/known_hosts_ocs_macminis
  -o StrictHostKeyChecking=yes
ansible_become_password: "{{ lookup('ansible.builtin.ini', 'MACMINI_SUDO_PASSWORD', type='properties', file=ocs_env_file, default='', interpolation=false) }}"
ocs_wifi_ssid: "{{ lookup('ansible.builtin.ini', 'MACMINI_WIFI_SSID', type='properties', file=ocs_env_file, default='', interpolation=false) }}"
ocs_wifi_password: "{{ lookup('ansible.builtin.ini', 'MACMINI_WIFI_PASSWORD', type='properties', file=ocs_env_file, default='', interpolation=false) }}"
ocs_netbird_setup_key: "{{ lookup('ansible.builtin.ini', 'NETBIRD_MACMINI_SETUP_KEY', type='properties', file=ocs_env_file, default='', interpolation=false) }}"

# Network: Wi-Fi is the main link (lower metric wins the default route); wired stays up as backup.
ocs_wifi_metric: 100
ocs_wired_metric: 200
ocs_wifi_regdomain: US

# Python and Ray. Every node (and any laptop that connects to the cluster) needs the
# same Python minor version and the same Ray version.
ocs_uv_version: "0.13.5"
ocs_python_version: "3.12"
ocs_root: /opt/ocs
ocs_venv: /opt/ocs/venv

ocs_apt_packages:
  # Wi-Fi (BCM4360 needs the out-of-tree wl driver) and kernel builds
  - dkms
  - linux-headers-generic
  - broadcom-sta-dkms
  - wpasupplicant
  - iw
  # Mac mini hardware
  - mbpfan
  - pciutils
  - lm-sensors
  - smartmontools
  - zram-tools
  # Python and builds (llama.cpp RPC and other native code later)
  - python3-dev
  - python3-venv
  - python3-pip
  - build-essential
  - cmake
  - ninja-build
  - ccache
  - pkg-config
  - libopenblas-dev
  - libcurl4-openssl-dev
  - git
  - git-lfs
  - numactl
  # Time, discovery, containers, metrics
  - chrony
  - avahi-daemon
  - libnss-mdns
  - docker.io
  - docker-compose-v2
  - prometheus-node-exporter
  - nfs-common
  # Tools
  - awscli
  - curl
  - jq
  - rsync
  - unzip
  - zstd
  - tree
  - htop
  - btop
  - tmux
  - vim
  - ncdu
  - iperf3
  - ethtool
  - sysstat
  - iotop
  - iftop
  - nload
  - bind9-dnsutils
  - net-tools
  - linux-tools-generic

# Download cache (tasks/cache_server.yml) on silver, wired at its reserved address.
# Clients use it when it answers, the internet otherwise.
ocs_cache_server: false          # true only in host_vars of the cache host
ocs_cache_host: 192.168.8.35
ocs_cache_http_port: 8090
ocs_cache_dir: /srv/ocs-cache

# Where the FIX stick's kit lives when the playbook runs on the machine itself.
ocs_bootstrap_dir: /root/ocs-bootstrap
